<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ocr-mcp">
  <title>ocr-mcp</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2430"/>
      <stop offset="1" stop-color="#11151d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9be7c4" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#6fd3ff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee2b8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7ee2b8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7ee2b8" stop-opacity="0"/>
    </linearGradient>
    <!-- Everything inside the lens reads as resolved text. -->
    <clipPath id="lens">
      <circle cx="300" cy="212" r="118"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- The page: lines of text, unresolved. -->
  <g fill="#48546a">
    <rect x="104" y="128" width="236" height="16" rx="8"/>
    <rect x="104" y="168" width="304" height="16" rx="8"/>
    <rect x="104" y="208" width="188" height="16" rx="8"/>
    <rect x="104" y="248" width="272" height="16" rx="8"/>
    <rect x="104" y="288" width="156" height="16" rx="8"/>
    <rect x="104" y="328" width="228" height="16" rx="8"/>
    <rect x="104" y="368" width="196" height="16" rx="8"/>
  </g>

  <!-- The same lines, read: brighter, sharper, only where the lens covers them. -->
  <g clip-path="url(#lens)">
    <circle cx="300" cy="212" r="118" fill="url(#glass)"/>
    <g fill="#8ef0c0">
      <rect x="104" y="128" width="236" height="16" rx="8"/>
      <rect x="104" y="168" width="304" height="16" rx="8"/>
      <rect x="104" y="208" width="188" height="16" rx="8"/>
      <rect x="104" y="248" width="272" height="16" rx="8"/>
      <rect x="104" y="288" width="156" height="16" rx="8"/>
    </g>
    <rect x="182" y="205" width="236" height="3" fill="url(#scan)"/>
  </g>

  <!-- Lens rim and handle. -->
  <circle cx="300" cy="212" r="118" fill="none" stroke="#7ee2b8" stroke-width="14"/>
  <circle cx="300" cy="212" r="118" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25"/>
  <path d="M214 296 L146 364" stroke="#7ee2b8" stroke-width="30" stroke-linecap="round"/>
  <path d="M214 296 L146 364" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.18"/>
</svg>
